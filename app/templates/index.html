<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Translator Service</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body,
      html {
        height: 100%;
        margin: 0;
        background-color: white;
        display: flex;
        flex-direction: column;
      }
      .content {
        flex: 1;
      }
      .navbar {
        background-color: #34568b;
      }
      .btn-primary {
        background-color: #88b04b;
        border-color: #88b04b;
      }
      .form-label {
        color: #34568b;
      }
      .logo {
        max-width: 30%;
        height: auto;
        padding: 20px;
      }
      .footer {
        color: black;
        text-align: center;
        padding: 10px 0;
        width: 100%;
      }
      .form-container {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        height: 100%;
        padding: 20px;
      }
      .form-box {
        width: 100%;
        max-width: 600px;
        margin: 10px 0;
      }
      .btn-container {
        text-align: center;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container">
        <a class="navbar-brand mx-auto" href="#">Translator Service</a>
        <div class="navbar-text text-light">AlphaLoops TASK-Exercise</div>
      </div>
    </nav>

    <div class="content">
      <div class="container form-container">
        <div class="form-box">
          <label for="text" class="form-label">Text to Translate</label>
          <textarea id="text" class="form-control" rows="10"></textarea>
        </div>
        <div class="form-box">
          <label for="languages" class="form-label">Languages</label>
          <input
            id="languages"
            class="form-control"
            type="text"
            placeholder="e.g., english, german, russian"
          />
          <small class="form-text text-muted"
            >Write the languages you want to translate your text to, separated
            by commas.</small
          >
        </div>
        <div class="btn-container">
          <button class="btn btn-primary" onclick="translateText()">
            Translate
          </button>
        </div>
      </div>
    </div>

    <div class="footer">&copy; 2024 Translator Service</div>

    <script>
      async function translateText() {
        // Extract the text and languages from the form
        const text_for_translation = document.getElementById("text").value;
        const languages_chosen = document.getElementById("languages").value.split(",").map(lang => lang.trim());

        if (text_for_translation.length === 0 || languages_chosen.length === 0) {
          alert("Please enter text and select at least one language.");
          return;
        }
        const progressBar = document.getElementById("progress_bar");
        const progressBarText = document.getElementById("progress_bar_text");
        progressBar.classList.remove('bg-success');
        progressBar.classList.add('bg-primary');
        progressBarText.textContent = "Translating...";
        progressBar.style.width = "0%";
        progressBar.style.transition = "width 0.3s ease-in-out";

        // Prepare the payload
        const payload = {
          text: text_for_translation,
          languages: languages_chosen,
        };

        try {
          // Execute the POST request to the translation endpoint
          const response = await fetch("http://localhost:8000/translate", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(payload),
          });

          // Check if the response is OK
          if (!response.ok) {
            throw new Error(`HTTP error! Status: ${response.status}`);
          }

          // Parse and handle the response
          const result = await response.json();
          console.log("result", result);
          alert("Translation request submitted. ID: " + result.task_id);
          document.getElementById("progress-container").style.display = "block";
          document.getElementById("result").style.display = "none";
          document.getElementById("status-container").style.display('none');
          document.getElementById("content-container").style.display('none');

          let translationResult = null;
          let progress = 0;
          while (progress < 100) {
            await new Promise(resolve => setTimeout(resolve, 1000));
            const response = await getTranslationStatus(result.task_id);
            if (response.status === "completed") {
              translationResult = response.translation;
              progress += 100;
              break;
            }
            progress = 50;
            document.getElementById("progress-bar").style.width = `${progress}%`;
            document.getElementById("progress-bar-text").textContent = `Translating... ${progress}%`;
          }
          document.getElementById("progress-bar").style.width = "100%";
          document.getElementById("progress-bar-text").textContent = "Translated";
          document.getElementById("progress-bar").classList.remove('bg-primary');
          document.getElementById("progress-bar").classList.add('bg-success');
          document.getElementById("result").style.display = "block";
          document.getElementById("status-container").style.display('block');

        } catch (error) {
          console.error("Error:", error);
          alert("Failed to submit translation request.");
        }
      }
      async function getTranslationStatus(task_id) {
        const response = await fetch(`http://localhost:8000/translate/${task_id}`);
        const result = await response.json();
        console.log("result", result);
        return result;
      }
      async function getTranslationContent(task_id) {
        const response = await fetch(`http://localhost:8000/translate/content/${task_id}`);
        const result = await response.json();
        console.log("result", result);
        return result;
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
